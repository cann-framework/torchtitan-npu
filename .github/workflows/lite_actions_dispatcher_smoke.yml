name: Dispatcher-Smoke
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      test_cases:
        description: JSON test_id/suite selectors; empty uses defaults
        type: string
        required: false
permissions:
  contents: read
  actions: read
  checks: read
jobs:
  prepare:
    if: >-
      github.repository == 'cann-framework/torchtitan-npu' &&
      ((github.event_name == 'pull_request' && github.base_ref == 'master') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/ci/'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Expand immutable test plan
        id: plan
        env:
          CI_TEST_CASES: ${{ inputs.test_cases }}
          CI_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CI_WORKFLOW: lite_actions_dispatcher_smoke.yml
          CI_DEFAULT_WORKER: blue
          CI_DEFAULT_TARGET_POOL: a3_shared_blue
          CI_DEFAULT_DOCKER: cann_master_torchtitan_master_xyj
        run: PYTHONPATH="$PWD" python3 .github/scripts/lite_actions/prepare_request.py
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: lite-ci-request-${{ github.run_attempt }}
          path: .ci-request/ci-request.json
          retention-days: 1
          if-no-files-found: error
  case:
    # PRs validate the plan without dispatching hardware work.
    if: github.event_name != 'pull_request'
    needs: prepare
    name: ${{ matrix.case_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Wait for assigned worker
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_RESULT_AUTHOR: ${{ vars.LITE_CI_RESULT_ACTOR }}
          CI_PLAN_DIGEST: ${{ needs.prepare.outputs.plan_digest }}
          CI_CASE: ${{ toJSON(matrix) }}
          CI_WORKFLOW: lite_actions_dispatcher_smoke.yml
        run: python3 .github/scripts/lite_actions/wait_result.py
      - name: Record completed case
        env:
          CI_CASE_ID: ${{ matrix.case_id }}
        run: |
          mkdir -p .ci-matrix-result
          printf '%s\n' "$CI_CASE_ID" > .ci-matrix-result/case_id
      - uses: actions/upload-artifact@v4
        with:
          name: lite-ci-matrix-${{ github.run_attempt }}-${{ matrix.case_id }}
          path: .ci-matrix-result/case_id
          retention-days: 1
          if-no-files-found: error
  result:
    name: ${{ github.event_name == 'pull_request' && 'Lite-Actions-PR-Plan' || 'Lite-Actions-Smoke' }}
    if: always()
    needs: [prepare, case]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful plan and matrix
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          MATRIX_RESULT: ${{ needs.case.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$PREPARE_RESULT" = success
          if [ "$EVENT_NAME" != pull_request ]; then test "$MATRIX_RESULT" = success; fi
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: lite-ci-request-${{ github.run_attempt }}
          path: .ci-request
      - uses: actions/download-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          pattern: lite-ci-matrix-${{ github.run_attempt }}-*
          path: .ci-matrix-results
      - name: Require one completion per planned case
        if: github.event_name != 'pull_request'
        env:
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_PLAN_DIGEST: ${{ needs.prepare.outputs.plan_digest }}
        run: PYTHONPATH="$PWD" python3 .github/scripts/lite_actions/verify_matrix.py
