# Trusted target-branch workflow only. Publish/review this on the reviewed PR target Base
# before enabling; a proposed PR's copy must never be used as control code.
name: TorchTitan GitCode Forward
on:
  pull_request_target:
    branches: [master]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Target-repository PR number to observe (not a source ref)
        type: number
        required: true
permissions:
  repository: read
  pr: read
stages:
  forward:
    name: Trusted GitCode Bridge
    jobs:
      bridge:
        name: TorchTitan GitCode Forward
        if: >-
          atomgit.event_name == 'pull_request_target' ||
          (atomgit.event_name == 'workflow_dispatch' && atomgit.ref == 'refs/heads/master')
        # Hosted control job only; never provision a native runner on Blue.
        # The entrypoint rejects PR events until original-Action provenance and
        # durable pull-channel binding are implemented and verified.
        runs-on: [ubuntu-latest, x64, small]
        steps:
          - name: Checkout reviewed Base control
            identifier: trusted_control
            uses: checkout
            with:
              ref: ${{ vars.LITE_GITCODE_BRIDGE_SHA }}
          - name: Observe and forward exact PR version
            env:
              LITE_ACTIONS_GITCODE_EVENT_NAME: ${{ atomgit.event_name }}
              PR_NUMBER: ${{ atomgit.event.pull_request.number || inputs.pr_number }}
              EXPECTED_HEAD: ${{ atomgit.event.pull_request.head.sha }}
              LITE_ACTIONS_BRIDGE_SHA: ${{ vars.LITE_GITCODE_BRIDGE_SHA }}
              LITE_ACTIONS_RELEASE_CONFIG: ${{ vars.LITE_GITCODE_SMOKE_RELEASE }}
              LITE_ACTIONS_SDK_ROOT: ${{ vars.LITE_GITCODE_SDK_ROOT }}
              LITE_ACTIONS_BRIDGE_STATE: ${{ vars.LITE_GITCODE_BRIDGE_STATE }}
              LITE_ACTIONS_GITHUB_TOKEN: ${{ secrets.LITE_GITCODE_DISPATCH_TOKEN }}
              LITE_ACTIONS_GITCODE_TOKEN: ${{ secrets.LITE_GITCODE_AUTHORITY_TOKEN }}
              LITE_ACTIONS_GITCODE_PUBLICATION_TOKEN: ${{ secrets.LITE_GITCODE_PUBLICATION_TOKEN }}
            run: |
              cd "${{ steps.trusted_control.outputs.path }}"
              python3 -I -B .gitcode/scripts/lite_gitcode_forward.py --pr "$PR_NUMBER" --expected-head "$EXPECTED_HEAD"
