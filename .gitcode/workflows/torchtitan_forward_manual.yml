              # Replaced by the deterministic workflow generator, not by workflow inputs.
              CAPTURE_SCRIPT_SHA256 = "bc57e90cf3c643fab10b5beec585a5306185d4eab4839ef50e35a8b04a18bb99"


              PLATFORM_STEP_KEYS = {
                  "business_type",
