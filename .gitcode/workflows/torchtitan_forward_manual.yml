                          and "\\" not in path
                          and ".." not in path,
                          "UNSAFE_API_PATH",
                      )
                      headers = {"Accept": "application/json", "User-Agent": "lite-gitcode-manual-control-v1"}
                      if service == "gitcode":
                          require(
                              self.gitcode_token and "\n" not in self.gitcode_token and "\r" not in self.gitcode_token,
