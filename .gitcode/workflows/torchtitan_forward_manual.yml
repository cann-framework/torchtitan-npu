# Generated by .gitcode/scripts/build_hosted_manual_workflow.py; review source and exact script digest.
# Manual current-observation only, NOT original PR provenance or official CANN acceptance.
name: TorchTitan Personal Manual Forward
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open personal-repository PR number
        type: number
        required: true
      test_case:
        description: worker_os_blue keeps the current OS-only route; os_8p_16p explicitly selects all three cases
        type: choice
        options: [worker_os_blue, os_8p_16p]
        default: worker_os_blue
permissions:
  action: read
  repository: read
  pr: read
  project: read
  issue: none
  note: none
stages:
  manual:
    name: Manual personal prevalidation
    jobs:
      manual_capture:
        name: manual_capture
        if: ${{ atomgit.repository == 'depeng1994/torchtitan-npu' && atomgit.event_name == 'Manual' && atomgit.ref == 'refs/heads/master' }}
        runs-on: [ubuntu-latest, x64, small]
        timeout-minutes: 20
        steps:
          - id: manual_capture
            name: Capture manual request
            shell: bash
            working-directory: '.'
            env:
              EVENT_NAME: ${{ atomgit.event_name }}
              RUN_ATTEMPT: ${{ atomgit.run_attempt }}
              REPOSITORY: ${{ atomgit.repository }}
              REPOSITORY_ID: ${{ atomgit.repository_id }}
              REF: ${{ atomgit.ref }}
              ACTOR: ${{ atomgit.actor }}
              CONTROL_SHA: ${{ vars.LITE_GITCODE_BRIDGE_SHA }}
              ATOMGIT_TOKEN: ${{ atomgit.token }}
              PR_NUMBER: ${{ inputs.pr_number }}
              TEST_CASE: ${{ inputs.test_case }}
            run: |
              python3 -I -B - <<'PY'
              """Bounded standard-library control; generated inline, never imports PR source."""

              import json
              import re
              import sys
              import urllib.error
              import urllib.parse
              import urllib.request

              GC_REPO = "depeng1994/torchtitan-npu"
              GC_ID = "9075802"
              GH_REPO = "cann-framework/torchtitan-npu"
              GH_ID = 1210038933
              GH_WORKFLOW_ID = 381287884
              GH_WORKFLOW = ".github/workflows/lite_actions_dispatcher_smoke.yml"
              GC_WORKFLOW = ".gitcode/workflows/torchtitan_forward_manual.yml"
              CAPTURE_JOB = "manual_capture"
              CAPTURE_STEP = "1"
              CAPTURE_NAME = "Capture manual request"
              PREFIX = "LITE_GITCODE_MANUAL_CAPTURE_V1 "
              ALLOWED_ACTOR = "depeng1994"
              ALLOWED_CASES = ("worker_os_blue", "dispatch_smoke_8p", "dispatch_smoke_16p")
              CHECKS_APP_ID = 5575236


              class ManualForwardError(RuntimeError):
                  """Only fixed non-secret reason codes may be emitted."""


              def require(value, code):
                  if not value:
                      raise ManualForwardError(code)


              def canonical(value):
                  return json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=False, allow_nan=False).encode()


              def sha(value):
                  require(isinstance(value, str) and re.fullmatch(r"[0-9a-f]{40}", value), "INVALID_SHA")
                  return value


              def ident(value):
                  require(isinstance(value, str) and re.fullmatch(r"[A-Za-z0-9_-]{1,100}", value), "INVALID_PLATFORM_ID")
                  return value


              def ref(value):
                  require(isinstance(value, str) and 0 < len(value) <= 200, "INVALID_REF")
                  require(
                      not any(ord(c) < 33 for c in value)
                      and not any(x in value for x in ("..", "@{", "\\", "~", "^", ":", "?", "*", "[")),
                      "INVALID_REF",
                  )
                  require(not value.startswith(("/", "-")) and not value.endswith(("/", ".", ".lock")), "INVALID_REF")
                  return value


              def api_route_label(service, path, *, dispatch=False):
                  # Only fixed labels: never interpolate user-controlled URLs, IDs, headers or bodies.
                  if service == "gitcode":
                      if "/actions/runs/" in path:
                          if path.endswith("/logs"):
                              return "GITCODE_ACTION_STEP_LOGS"
                          if "/jobs/" in path:
